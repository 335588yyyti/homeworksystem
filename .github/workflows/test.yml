name: 自動測試

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 全部測試分成 3 份，3 台測試電腦同時跑，等待時間大約變成三分之一
  shard:
    name: 測試 ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 確認 assets/tailwind.css 是最新的（改了 index.html 的 class 要執行 npm run build:css）
        run: npm run check:css

      # Ubuntu 套件伺服器偶爾連不上：失敗就等一分鐘再試，最多 3 次
      - name: 安裝測試用瀏覽器
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "第 $i 次安裝失敗，60 秒後再試"
            sleep 60
          done
          exit 1

      - name: 執行測試
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: 上傳測試報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # 3 份都通過才算通過（名稱維持 test，跟以前一樣）
  test:
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    steps:
      - name: 確認 3 份測試都通過
        run: test "${{ needs.shard.result }}" = "success"

  rules:
    name: 安全規則測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝套件
        run: npm ci

      - name: 用 Firestore 模擬器檢查 firestore.rules
        run: npm test
